<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Salary Slip - {{ employee.employee_name }}</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>
<div class="container salary-preview-page">
    <div class="slip-actions">
        <a class="btn secondary" href="{{ url_for('index') }}">← Back</a>
        <div class="preview-heading">
            <strong>{{ employee.employee_name }}</strong>
            <span>{{ month_name }}</span>
        </div>
        <form action="{{ url_for('download') }}" method="POST">
            <input type="hidden" name="employee_id" value="{{ employee.employee_id }}">
            <input type="hidden" name="year" value="{{ year }}">
            <input type="hidden" name="month" value="{{ month }}">
            <button class="btn primary" type="submit">Download PDF</button>
        </form>
    </div>

    <div class="pdf-preview-shell">
        <iframe src="{{ preview_pdf_url }}#toolbar=0&navpanes=0"
                title="Salary slip PDF preview">
            <p>Your browser cannot display this PDF.
                <a href="{{ preview_pdf_url }}">Open the salary slip PDF</a>.
            </p>
        </iframe>
    </div>
</div>
</body>
</html>
